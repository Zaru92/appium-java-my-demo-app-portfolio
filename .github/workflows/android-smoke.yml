name: Android Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Appium smoke on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Appium and UiAutomator2
        run: |
          npm install --global appium@3.5.1
          appium driver install uiautomator2@7.6.1
          appium --version
          appium driver list --installed

      - name: Download Android application
        run: ./scripts/download-apps.sh android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-snapshot-save
          disable-animations: true
          script: ./scripts/run-ci-android-smoke.sh

      - name: Upload Android smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke-artifacts
          path: |
            target/surefire-reports/
            target/allure-results/
            target/failure-artifacts/
            target/appium-server.log
          if-no-files-found: warn
          retention-days: 7
