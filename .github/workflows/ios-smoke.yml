name: iOS Simulator Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Appium smoke on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Appium and XCUITest
        run: |
          npm install --global appium@3.5.1
          appium driver install xcuitest@11.11.2
          appium --version
          appium driver list --installed

      - name: Download iOS Simulator application
        run: ./scripts/download-apps.sh ios

      - name: Run iOS Simulator smoke test
        run: ./scripts/run-ci-ios-smoke.sh

      - name: Upload iOS Simulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-smoke-artifacts
          path: |
            target/surefire-reports/
            target/allure-results/
            target/failure-artifacts/
            target/appium-server.log
          if-no-files-found: warn
          retention-days: 7
