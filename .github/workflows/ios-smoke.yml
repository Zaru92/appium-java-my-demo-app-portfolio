name: iOS Simulator Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Appium smoke on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Appium and XCUITest
        run: |
          npm install --global appium@3.5.1
          appium driver install xcuitest@11.11.2
          appium --version
          appium driver list --installed

      - name: Download iOS Simulator application
        run: ./scripts/download-apps.sh ios

      - name: Run iOS Simulator smoke test
        run: ./scripts/run-ci-ios-smoke.sh

      - name: Upload iOS Simulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-smoke-artifacts
          path: |
            target/surefire-reports/
            target/allure-results/
            target/failure-artifacts/
            target/appium-server.log
          if-no-files-found: warn
          retention-days: 7
